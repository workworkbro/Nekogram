name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      GRADLE_OPTS: "-Dorg.gradle.workers.max=2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=false' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_JKS }}" ]; then
            keytool -genkey -v -keystore keystore.jks -alias nekogram -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Neko, OU=Neko, O=Neko, L=City, S=State, C=US"
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=123456" >> local.properties
            echo "keyAlias=nekogram" >> local.properties
            echo "keyPassword=123456" >> local.properties
          else
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
            echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks
          fi

      - name: Configure Secrets
        run: |
          if [ -n "${{ secrets.API_ID }}" ]; then echo "apiId=${{ secrets.API_ID }}" >> local.properties; fi
          if [ -n "${{ secrets.API_HASH }}" ]; then echo "apiHash=${{ secrets.API_HASH }}" >> local.properties; fi
          if [ -n "${{ secrets.HELPER_BOT_ID }}" ]; then echo "helperBotId=${{ secrets.HELPER_BOT_ID }}" >> local.properties; fi
          if [ -n "${{ secrets.HELPER_BOT_USERNAME }}" ]; then echo "helperBotUsername=${{ secrets.HELPER_BOT_USERNAME }}" >> local.properties; fi
          if [ -n "${{ secrets.SENTRY_DSN }}" ]; then echo "sentryDsn=${{ secrets.SENTRY_DSN }}" >> local.properties; fi
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then echo "mapsApiKey=${{ secrets.MAPS_API_KEY }}" >> local.properties; fi

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > TMessagesProj_App/google-services.json
          else
            echo '{"project_info":{"project_number":"760348033671","project_id":"nekogram","storage_bucket":"nekogram.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:760348033671:android:e1a2b3c4d5e6f7a8b9c0d1","android_client_info":{"package_name":"tw.nekomimi.nekogram"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForOfflineBuild12345678"}],"services":{"analytics_service":{"status":1}}},{"client_info":{"mobilesdk_app_id":"1:760348033671:android:e1a2b3c4d5e6f7a8b9c0d2","android_client_info":{"package_name":"org.telegram.messenger.regular"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForOfflineBuild12345678"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > TMessagesProj_App/google-services.json
          fi
          touch sentry.properties

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/23* /usr/local/lib/android/sdk/ndk/24* /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* /opt/ghc || true
          sudo apt-get clean || true
          df -h

      - name: Build with Gradle
        run: |
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Locate APKs
        if: always()
        run: |
          mkdir -p final_apks
          find . -type f -name "*.apk" -exec cp -v {} final_apks/ \;
          ls -la final_apks/

      - name: Debug and Push Outputs
        if: always()
        run: |
          find . -name "*.apk" -o -name "*.aab" -o -name "*Nekogram*" | head -n 100 > build_files.txt || true
          grep -B 15 -A 40 "FAILURE: Build failed with an exception." build.log > build_tail.txt || tail -n 250 build.log > build_tail.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-info
          git add -f build_files.txt build_tail.txt
          git commit -m "Debug info [skip ci]" || true
          git push -f origin debug-info || true
          git checkout - || true

      - name: Upload arm64-v8a build apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-arm64-v8a
          path: final_apks/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with direct APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Nekogram 60 FPS + 3D VTuber Avatars"
          body: |
            ### Nekogram arm64-v8a (60 FPS + 3D Avatars)
            * Прямой APK файл (установка в 1 клик, распаковывать ZIP не нужно)
            * Разблокировано 60 FPS в видеозвонках
            * 3D VTuber аватары: Nova Shark, Cyber-Goth, Anime Boy
            * Полная защита приватности камеры
          files: final_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

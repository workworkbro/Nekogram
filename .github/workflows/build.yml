name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      GRADLE_OPTS: "-Dorg.gradle.workers.max=2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;4.0.2"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=false' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_JKS }}" ]; then
            keytool -genkey -v -keystore keystore.jks -alias nekogram -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Neko, OU=Neko, O=Neko, L=City, S=State, C=US"
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=123456" >> local.properties
            echo "keyAlias=nekogram" >> local.properties
            echo "keyPassword=123456" >> local.properties
          else
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
            echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks
          fi

      - name: Configure Secrets
        run: |
          echo "apiId=${{ secrets.API_ID }}" >> local.properties
          echo "apiHash=${{ secrets.API_HASH }}" >> local.properties
          echo "helperBotId=${{ secrets.HELPER_BOT_ID }}" >> local.properties
          echo "helperBotUsername=${{ secrets.HELPER_BOT_USERNAME }}" >> local.properties
          echo "sentryDsn=${{ secrets.SENTRY_DSN }}" >> local.properties
          echo "mapsApiKey=${{ secrets.MAPS_API_KEY }}" >> local.properties

          # Create placeholder google-services.json (gitignored, so must be created at build time)
          cat > TMessagesProj_App/google-services.json << 'JSON'
          {
            "project_info": { "project_number": "0", "project_id": "none", "storage_bucket": "" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "org.telegram.messenger.regular" } }, "oauth_client": [], "api_key": [{ "current_key": "" }], "services": {} }],
            "configuration_version": "1"
          }
          JSON
          touch sentry.properties

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/23* /usr/local/lib/android/sdk/ndk/24* /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* /opt/ghc || true
          sudo apt-get clean || true
          df -h

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease -x bundlePlay -x sentryUploadSourceBundlePlay --no-daemon

      - name: Upload arm64-v8a build apk
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-arm64-v8a
          path: TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk
